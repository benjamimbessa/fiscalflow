services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fiscalflow
      POSTGRES_PASSWORD: dev_only
      POSTGRES_DB: orders
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb
    ports: ["8000:8000"]

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sns,sqs
    ports: ["4566:4566"]

volumes:
  pgdata:
